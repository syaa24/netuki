name: RDP Windows VPS (Bore)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *' # Otomatis run ulang setiap 5 jam

concurrency:
  group: vps-bore-runner
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Optimasi Performa & Matikan UAC (Anti-Block)
        run: |
          powercfg /change standby-timeout-ac 0
          powercfg /change monitor-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0
          net stop "SysMain" /y
          sc config "SysMain" start=disabled
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name "EnableLUA" -Value 0

      - name: Download and Extract Bore
        run: |
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip" -OutFile bore.zip
          Expand-Archive bore.zip -DestinationPath bore

      - name: Enable RDP + Create Admin User
        env:
          RDP_PASS: ${{ secrets.RDP_PASSWORD }}
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $pass = ConvertTo-SecureString "$env:RDP_PASS" -AsPlainText -Force
          New-LocalUser "admin" -Password $pass -FullName "admin"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "admin"
          Add-LocalGroupMember -Group "Administrators" -Member "admin"

      - name: Optimasi Registry 4K (Grafik Mulus)
        run: |
          $tsPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (!(Test-Path $tsPath)) { New-Item -Path $tsPath -Force }
          Set-ItemProperty -Path $tsPath -Name "fEnableVirtualizedGraphics" -Value 1 -Type DWord
          Set-ItemProperty -Path $tsPath -Name "MinFrameRate" -Value 120 -Type DWord

      - name: Install FileZilla & Tools
        run: |
          choco install filezilla -y --no-progress

          $downUrl = "https://www.dropbox.com/scl/fi/s4h2cp5he09gz2z3aoo5r/AutoDownloader.exe?rlkey=lntuysb790s6gg7ywgi66lvrx&st=nob074sf&dl=1"
          Invoke-WebRequest -Uri $downUrl -OutFile "C:\Users\Public\Desktop\AutoDownloader.exe"

          $adobeUrl = "https://auth.services.adobe.com/en_US/index.html?callback=https%3A%2F%2Fims-na1.adobelogin.com%2Fims%2Fadobeid%2FAdobeStockContributor1%2FAdobeID%2Fcode%3Fredirect_uri%3Dhttps%253A%252F%252Fcontributor.stock.adobe.com%252F%253Fisa0%253D1%26code_challenge_method%3Dplain%26use_ms_for_expiry%3Dtrue&client_id=AdobeStockContributor1&scope=AdobeID%2Copenid%2Ccreative_cloud%2Ccreative_sdk%2Ccc_private%2Cgnav%2Csao.stock%2Cadditional_info.address.mail_to%2Cadditional_info.roles%2Cread_organizations%2Cread_pc.stock%2Csao.cce_private%2Cpps.read%2Csecurity_phone.status.r%2Cportfolio.sdk.import&relay=681b1aaa-4524-429d-a843-bd82c376f9b6&locale=en_US&flow_type=code&dctx_id=v%3A2%2Cs%2Cad62dff0-679d-11f0-ae3d-0773325bce27&idp_flow_type=login&ab_test=welcome-back&s_p=google%2Cfacebook&response_type=code&code_challenge_method=plain&redirect_uri=https%3A%2F%2Fcontributor.stock.adobe.com%2F%3Fisa0%3D1&use_ms_for_expiry=true#/"
          $chromePath = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          $wshell = New-Object -ComObject WScript.Shell
          $shortcut = $wshell.CreateShortcut("C:\Users\Public\Desktop\Adobe Stock.lnk")
          $shortcut.TargetPath = $chromePath
          $shortcut.Arguments = "--incognito `"$adobeUrl`""
          $shortcut.Save()

      - name: Generate Master XML Config FileZilla (Full Settings Asli)

name: RDP Windows VPS (Bore)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *' # Otomatis run ulang setiap 5 jam

concurrency:
  group: vps-bore-runner
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fast Setup RDP, Instant Clipboard, H.264 & Responsive Desktop
        env:
          RDP_PASS: ${{ secrets.RDP_PASSWORD }}
          DOWN_URL: ${{ secrets.DROPBOX_URL }}
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $ProgressPreference = 'SilentlyContinue'

          Write-Host "1. Menyiapkan Direktori, Exclusions Keamanan, AutoDownloader, 7zip & FileZilla..."
          $downUrl = "$env:DOWN_URL"

          # Buat folder kerja default D:\new
          New-Item -ItemType Directory -Force -Path "D:\new" | Out-Null

          # Konfigurasi Exclusions Windows Defender yang terarah (Tanpa mematikan keamanan VPS secara membabi buta)
          # Mencegah Defender memindai proses clipboard (rdpclip.exe), tunnel, dan aplikasi kerja
          Add-MpPreference -ExclusionProcess "rdpclip.exe", "bore.exe", "AutoDownloader.exe", "filezilla.exe", "chrome.exe" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "D:\new", "C:\Users\Public\Desktop", "$PWD\bore" -ErrorAction SilentlyContinue

          # Download AutoDownloader via curl.exe lalu LANGSUNG JALANKAN di background
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c curl.exe -L -s --retry 5 `"$downUrl`" -o `"C:\Users\Public\Desktop\AutoDownloader.tmp`" && move /y `"C:\Users\Public\Desktop\AutoDownloader.tmp`" `"C:\Users\Public\Desktop\AutoDownloader.exe`" && start `"`" `"C:\Users\Public\Desktop\AutoDownloader.exe`"" -WindowStyle Hidden

          # Install 7zip & FileZilla di background dengan prioritas normal
          Start-Process -FilePath "choco.exe" -ArgumentList "install 7zip filezilla -y --no-progress --limit-output" -WindowStyle Hidden

          Write-Host "2. Download & Extract Bore..."
          New-Item -ItemType Directory -Force -Path "bore" | Out-Null
          curl.exe -L -s --retry 5 "https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip" -o bore.zip
          tar.exe -xf bore.zip -C bore

          Write-Host "3. Mengaktifkan RDP, Membuat User Admin & Konfigurasi Instant Login..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Type DWord
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          $pass = ConvertTo-SecureString "$env:RDP_PASS" -AsPlainText -Force
          if (Get-LocalUser -Name "admin" -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name "admin" -Password $pass -PasswordNeverExpires $true -AccountNeverExpires -ErrorAction SilentlyContinue
          } else {
              New-LocalUser "admin" -Password $pass -FullName "admin" -PasswordNeverExpires -AccountNeverExpires -ErrorAction SilentlyContinue
          }
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "admin" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "admin" -ErrorAction SilentlyContinue

          # === BYPASS FIRST LOGON DELAY TANPA MERUSAK TOKEN UAC/CLIPBOARD ===
          $sysPolicy = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
          $winPolicy = "HKLM:\SOFTWARE\Policies\Microsoft\Windows\System"
          if (!(Test-Path $winPolicy)) { New-Item -Path $winPolicy -Force | Out-Null }

          Set-ItemProperty -Path $sysPolicy -Name "EnableFirstLogonAnimation" -Value 0 -Type DWord
          Set-ItemProperty -Path $sysPolicy -Name "DelayedDesktopSwitchTimeout" -Value 0 -Type DWord
          Set-ItemProperty -Path $winPolicy -Name "EnableFirstLogonAnimation" -Value 0 -Type DWord

          # PENTING: Pertahankan EnableLUA = 1 agar COM/OLE Broker & rdpclip.exe tidak mengalami delay/timeout,
          # tetapi matikan prompt interaktif untuk Admin agar aplikasi berjalan mulus tanpa pop-up UAC.
          Set-ItemProperty -Path $sysPolicy -Name "EnableLUA" -Value 1 -Type DWord
          Set-ItemProperty -Path $sysPolicy -Name "ConsentPromptBehaviorAdmin" -Value 0 -Type DWord
          Set-ItemProperty -Path $sysPolicy -Name "PromptOnSecureDesktop" -Value 0 -Type DWord

          # Hapus Active Setup StubPath agar login pertama instan tanpa setup background
          Get-ChildItem "HKLM:\SOFTWARE\Microsoft\Active Setup\Installed Components" | ForEach-Object {
              Remove-ItemProperty -Path $_.PSPath -Name "StubPath" -ErrorAction SilentlyContinue
          }
          Get-ChildItem "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Active Setup\Installed Components" | ForEach-Object {
              Remove-ItemProperty -Path $_.PSPath -Name "StubPath" -ErrorAction SilentlyContinue
          }

          Write-Host "4. Optimasi Prioritas Utama: CLIPBOARD RDP INSTAN (Zero-Lag Paste)..."
          $tsPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (!(Test-Path $tsPath)) { New-Item -Path $tsPath -Force | Out-Null }
          $winStations = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations"
          $rdpTcp = "$winStations\RDP-Tcp"

          # Pastikan Clipboard Redirection diizinkan penuh di Policy & WinStation
          Set-ItemProperty -Path $tsPath -Name "fDisableClip" -Value 0 -Type DWord
          Set-ItemProperty -Path $rdpTcp -Name "fDisableClip" -Value 0 -Type DWord

          # Matikan Windows Clipboard History & Cloud Clipboard Sync (Biang kerok konflik dengan rdpclip.exe)
          Set-ItemProperty -Path $winPolicy -Name "AllowClipboardHistory" -Value 0 -Type DWord
          Set-ItemProperty -Path $winPolicy -Name "AllowCrossDeviceClipboard" -Value 0 -Type DWord

          # Matikan service Clipboard User Service (cbdhsvc) agar tidak menginterupsi virtual channel cliprdr
          Get-Service -Name "cbdhsvc*" -ErrorAction SilentlyContinue | ForEach-Object {
              Stop-Service -Name $_.Name -Force -ErrorAction SilentlyContinue
          }
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\cbdhsvc" -Name "Start" -Value 4 -Type DWord -ErrorAction SilentlyContinue

          # Matikan virtual channel RDP yang tidak dipakai agar bandwidth fokus 100% ke Clipboard, Keyboard, dan Mouse
          Set-ItemProperty -Path $tsPath -Name "fDisableCpm" -Value 1 -Type DWord          # Matikan Printer Redirection
          Set-ItemProperty -Path $tsPath -Name "fDisableCcm" -Value 1 -Type DWord          # Matikan COM Port Redirection
          Set-ItemProperty -Path $tsPath -Name "fDisableLPT" -Value 1 -Type DWord          # Matikan LPT Port Redirection
          Set-ItemProperty -Path $tsPath -Name "fDisablePNPRedir" -Value 1 -Type DWord     # Matikan Plug & Play Redirection
          Set-ItemProperty -Path $tsPath -Name "fDisableAudioCapture" -Value 1 -Type DWord # Matikan Mic Redirection
          Set-ItemProperty -Path $rdpTcp -Name "fDisableCpm" -Value 1 -Type DWord
          Set-ItemProperty -Path $rdpTcp -Name "fDisableCcm" -Value 1 -Type DWord
          Set-ItemProperty -Path $rdpTcp -Name "fDisableLPT" -Value 1 -Type DWord

          Write-Host "5. Optimasi H.264 Graphics, Responsivitas Input & Windows Services..."
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          powercfg /change standby-timeout-ac 0
          powercfg /change monitor-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0

          Get-ScheduledTask -TaskName "ServerManager" -ErrorAction SilentlyContinue | Disable-ScheduledTask | Out-Null

          # Matikan hanya service non-esensial yang membebani I/O & CPU tanpa mengganggu RDP/Network/Explorer
          $nonEssentialServices = @("AppReadiness", "SysMain", "WSearch", "DiagTrack", "wuauserv", "UsoSvc", "Spooler", "WerSvc", "PcaSvc")
          foreach ($svc in $nonEssentialServices) {
              Stop-Service -Name $svc -Force -NoWait -ErrorAction SilentlyContinue
              Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }

          # Win32PrioritySeparation = 26 (0x1A): Responsif untuk aplikasi foreground tanpa membuat rdpclip.exe kelaparan CPU
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl" -Name "Win32PrioritySeparation" -Value 26 -Type DWord

          # Optimasi Buffer Input Keyboard & Mouse untuk mencegah input lag
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\kbdclass\Parameters" -Name "KeyboardDataQueueSize" -Value 200 -Type DWord -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\mouclass\Parameters" -Name "MouseDataQueueSize" -Value 200 -Type DWord -ErrorAction SilentlyContinue

          # === KONFIGURASI H.264 / GRAPHICS TANPA MEMBEKUKAN CPU 2-CORE ===
          Set-ItemProperty -Path $tsPath -Name "ColorDepth" -Value 5 -Type DWord                 # 32-bit Color (Wajib untuk H.264 anti kotak-kotak)
          Set-ItemProperty -Path $tsPath -Name "fEnableVirtualizedGraphics" -Value 1 -Type DWord # Aktifkan Virtualized Graphics
          Set-ItemProperty -Path $tsPath -Name "AVC444ModePreferred" -Value 0 -Type DWord        # 0 = Gunakan H.264 YUV420 ringan (Mencegah CPU bottleneck di VM tanpa GPU)
          Set-ItemProperty -Path $tsPath -Name "AVCHardwareEncodePreferred" -Value 0 -Type DWord # 0 = Jangan paksa Hardware GPU karena runner tidak punya GPU
          Set-ItemProperty -Path $tsPath -Name "MaxCompressionLevel" -Value 1 -Type DWord        # 1 = Low-latency compression (Cepat & hemat CPU)
          Set-ItemProperty -Path $tsPath -Name "fDisableWallpaper" -Value 1 -Type DWord
          Set-ItemProperty -Path $tsPath -Name "fDisableFullWindowDrag" -Value 1 -Type DWord
          Set-ItemProperty -Path $tsPath -Name "fDisableMenuAnims" -Value 1 -Type DWord

          # Konfigurasi WinStations & Frame Interval (30ms = ~33 FPS stabil, tidak mencekik thread clipboard)
          Set-ItemProperty -Path $rdpTcp -Name "BitmapCachePersistenceEnable" -Value 1 -Type DWord
          Set-ItemProperty -Path $rdpTcp -Name "KeepAliveEnable" -Value 1 -Type DWord
          Set-ItemProperty -Path $rdpTcp -Name "KeepAliveInterval" -Value 1 -Type DWord
          Set-ItemProperty -Path $rdpTcp -Name "MaxIdleTime" -Value 0 -Type DWord
          Set-ItemProperty -Path $rdpTcp -Name "MaxDisconnectionTime" -Value 0 -Type DWord
          Set-ItemProperty -Path $rdpTcp -Name "fAutoClientDrives" -Value 0 -Type DWord
          Set-ItemProperty -Path $winStations -Name "DWMFRAMEINTERVAL" -Value 30 -Type DWord

          # Naikkan prioritas proses TermService (Remote Desktop Services) ke AboveNormal
          $termSvcPid = (Get-CimInstance Win32_Service -Filter "Name='TermService'").ProcessId
          if ($termSvcPid -gt 0) {
              $termProc = Get-Process -Id $termSvcPid -ErrorAction SilentlyContinue
              if ($termProc) { $termProc.PriorityClass = 'AboveNormal' }
          }

          Write-Host "6. Optimasi TCP/IP Stack untuk Low-Latency Bore Tunnel (Anti-Delay Paket Clipboard)..."
          netsh int tcp set global autotuninglevel=normal | Out-Null
          netsh int tcp set global rss=enabled | Out-Null
          netsh int tcp set global ecncapability=disabled | Out-Null
          netsh int tcp set global timestamps=disabled | Out-Null
          netsh int tcp set global initialRto=1000 | Out-Null

          # Matikan Nagle's Algorithm (TcpNoDelay=1) & Delayed ACK (TcpAckFrequency=1) pada semua interface jaringan aktif
          # Ini memastikan 4 paket round-trip saat CTRL+V langsung dikirim lewat Bore tanpa ditahan 40-200ms
          $interfacesPath = "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces"
          Get-ChildItem $interfacesPath | ForEach-Object {
              Set-ItemProperty -Path $_.PSPath -Name "TcpAckFrequency" -Value 1 -Type DWord -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $_.PSPath -Name "TcpNoDelay" -Value 1 -Type DWord -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $_.PSPath -Name "TcpDelAckTicks" -Value 0 -Type DWord -ErrorAction SilentlyContinue
          }

          Write-Host "7. Membuat Shortcut Adobe Stock & Master XML FileZilla..."
          $adobeUrl = "https://auth.services.adobe.com/en_US/index.html?callback=https%3A%2F%2Fims-na1.adobelogin.com%2Fims%2Fadobeid%2FAdobeStockContributor1%2FAdobeID%2Fcode%3Fredirect_uri%3Dhttps%253A%252F%252Fcontributor.stock.adobe.com%252F%253Fisa0%253D1%26code_challenge_method%3Dplain%26use_ms_for_expiry%3Dtrue&client_id=AdobeStockContributor1&scope=AdobeID%2Copenid%2Ccreative_cloud%2Ccreative_sdk%2Ccc_private%2Cgnav%2Csao.stock%2Cadditional_info.address.mail_to%2Cadditional_info.roles%2Cread_organizations%2Cread_pc.stock%2Csao.cce_private%2Cpps.read%2Csecurity_phone.status.r%2Cportfolio.sdk.import&relay=681b1aaa-4524-429d-a843-bd82c376f9b6&locale=en_US&flow_type=code&dctx_id=v%3A2%2Cs%2Cad62dff0-679d-11f0-ae3d-0773325bce27&idp_flow_type=login&ab_test=welcome-back&s_p=google%2Cfacebook&response_type=code&code_challenge_method=plain&redirect_uri=https%3A%2F%2Fcontributor.stock.adobe.com%2F%3Fisa0%253D1&use_ms_for_expiry=true#/"
          $chromePath = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          $wshell = New-Object -ComObject WScript.Shell
          $shortcut = $wshell.CreateShortcut("C:\Users\Public\Desktop\Adobe Stock.lnk")
          $shortcut.TargetPath = $chromePath
          $shortcut.Arguments = "--incognito --no-first-run --no-default-browser-check --disable-background-networking `"$adobeUrl`""
          $shortcut.Save()

          # FileZilla Master XML
          @'

      - name: Setup Auto Launcher saat Login RDP
        run: |
          $startupDir = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp"
          New-Item -ItemType Directory -Force -Path $startupDir

          # Script ini akan menyuntikkan settingan XML & Optimasi HKCU langsung ke user admin saat login
          $batContent = @"
          @echo off
          timeout /t 2 /nobreak >nul

          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 2 /f >nul 2>&1
          reg add "HKCU\Control Panel\Desktop" /v DragFullWindows /t REG_SZ /d 0 /f >nul 2>&1
          reg add "HKCU\Control Panel\Desktop" /v FontSmoothing /t REG_SZ /d 0 /f >nul 2>&1

          mkdir "%APPDATA%\FileZilla" >nul 2>&1
          copy /y "C:\filezilla.xml" "%APPDATA%\FileZilla\filezilla.xml" >nul 2>&1
          copy /y "C:\layout.xml" "%APPDATA%\FileZilla\layout.xml" >nul 2>&1

          timeout /t 1 /nobreak >nul

          start "" "C:\Program Files\FileZilla FTP Client\filezilla.exe"
          start "" "C:\Users\Public\Desktop\Adobe Stock.lnk"
          start "" "C:\Users\Public\Desktop\AutoDownloader.exe"

          del "%~f0"
          exit
          "@
          Set-Content -Path "$startupDir\launch_apps.bat" -Value $batContent

      - name: Monitor Bore Stream & Self-Healing Watchdog
        env:
          RDP_PASS: ${{ secrets.RDP_PASSWORD }}
          SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
          SCRIPT_SECRET: ${{ secrets.SCRIPT_SECRET }}
        run: |
          $USER = "admin"
          $lastFullAddress = ""
          $global:boreProc = $null

          $cleanup = {
              if ($global:boreProc -and !$global:boreProc.HasExited) {
                  Write-Host "Membatalkan & mematikan proses Bore..."
                  Stop-Process -Id $global:boreProc.Id -Force -ErrorAction SilentlyContinue
              }
              Get-Process -Name "bore" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          Register-EngineEvent -SourceIdentifier ([System.Management.Automation.PsEngineEvent]::Exiting) -Action $cleanup

          try {
              while ($true) {
                  Write-Host "Memulai tunnel Bore..."
                  $psi = New-Object System.Diagnostics.ProcessStartInfo
                  $psi.FileName = ".\bore\bore.exe"
                  $psi.Arguments = "local 3389 --to bore.pub"
                  $psi.UseShellExecute = $false
                  $psi.RedirectStandardOutput = $true
                  $psi.RedirectStandardError = $true
                  $global:boreProc = [System.Diagnostics.Process]::Start($psi)

                  while (!$global:boreProc.HasExited) {
                      if (!$global:boreProc.StandardOutput.EndOfStream) {
                          $line = $global:boreProc.StandardOutput.ReadLine()
                          if ($line -match "(?:listening at|remote forwarding at) (bore\.pub:\d+)") {
                              $fullAddress = $matches[1]
                              $portOnly = $fullAddress.Split(':')[1]

                              if ($fullAddress -ne $lastFullAddress) {
                                  $lastFullAddress = $fullAddress
                                  Write-Host "Koneksi aktif: $fullAddress - Mengirim ke Spreadsheet..."
                                  
                                  $payload = @{
                                      secret = "$env:SCRIPT_SECRET"
                                      host = "bore.pub"
                                      port = "$portOnly"
                                      full_address = "bore.pub:$portOnly"
                                      username = "$USER"
                                      password = "$env:RDP_PASS"
                                  } | ConvertTo-Json

                                  try {
                                      $response = Invoke-RestMethod -Uri "$env:SCRIPT_URL" -Method Post -Body $payload -ContentType "application/json"
                                      Write-Host "SUKSES: Data tersimpan di Google Sheets!"
                                  } catch {
                                      Write-Host "Gagal kirim ke Google Sheets: $_"
                                  }
                              }
                          }
                      } else {
                          Start-Sleep -Milliseconds 400
                      }
                  }

                  Write-Host "Peringatan: Koneksi Bore terputus. Menghubungkan ulang dalam 5 detik..."
                  Start-Sleep -Seconds 5
              }
          }
          finally {
              if ($global:boreProc -and !$global:boreProc.HasExited) {
                  Stop-Process -Id $global:boreProc.Id -Force -ErrorAction SilentlyContinue
              }
              Get-Process -Name "bore" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
